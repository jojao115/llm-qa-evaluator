name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Sem chave de API: o CI nunca gasta crédito. O LLM é simulado nos testes.
      - run: pytest
      - name: Eval com o juiz simulado (confere o pipeline de ponta a ponta)
        run: python -m evals.run_evals --saida /tmp/eval

  docker:
    name: docker compose sobe e avalia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: docker compose up -d --build --wait

      - name: Saúde e uma avaliação
        run: |
          curl -fsS http://127.0.0.1:8000/saude
          python3 - <<'EOF'
          import json, urllib.request
          primeira = open("evals/dataset.jsonl", encoding="utf-8").readline()
          ex = json.loads(primeira)
          corpo = json.dumps({"rubrica_id": ex["rubrica"], "conversa": ex["conversa"]}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8000/avaliar", corpo, {"Content-Type": "application/json"}
          )
          r = json.load(urllib.request.urlopen(req))
          assert 0 <= r["nota"] <= 100, r
          print("nota:", r["nota"], "| provedor:", r["meta"]["provedor"])
          EOF

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down
